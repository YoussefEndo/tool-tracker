<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un outil - Tool Calibration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f0f4f8; }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 3px solid #e94560;
        }
        .header h1 { color: white; font-weight: 800; font-size: 1.5rem; }
        .header a { color: rgba(255,255,255,0.8); text-decoration: none; }
        .header a:hover { color: white; }
        .form-card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .form-card .card-header {
            background: white;
            border-bottom: 1px solid #f3f4f6;
            padding: 16px 24px;
            font-weight: 600;
        }
        .form-label { font-weight: 500; font-size: 0.9rem; color: #374151; }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 10px 14px;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
        }
        .btn-secondary {
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
        }
        .tool-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        .alert { border-radius: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1><i class="bi bi-pencil"></i> Modifier un outil</h1>
            </div>
            <div>
                <a href="/tools/"><i class="bi bi-arrow-left"></i> Retour à la liste</a>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="form-card card">
                <div class="card-header">
                    <i class="bi bi-tools text-primary me-2"></i> Modifier : <strong>{{ tool.name }}</strong>
                </div>
                <div class="card-body p-4">
                    
                    <div class="tool-info">
                        <div class="row">
                            <div class="col-md-6">
                                <small class="text-muted">N° série</small><br>
                                <strong>{{ tool.serial_number }}</strong>
                            </div>
                            <div class="col-md-6">
                                <small class="text-muted">Créé le</small><br>
                                <strong>{{ tool.created_at|date:"d/m/Y" }}</strong>
                            </div>
                        </div>
                    </div>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nom de l'outil *</label>
                                <input type="text" name="name" class="form-control" required value="{{ tool.name }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Numéro de série *</label>
                                <input type="text" name="serial_number" class="form-control" required value="{{ tool.serial_number }}">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Fabricant</label>
                                <input type="text" name="manufacturer" class="form-control" value="{{ tool.manufacturer|default:'' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Type d'outil</label>
                                <input type="text" name="tool_type" class="form-control" value="{{ tool.tool_type|default:'' }}">
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="2">{{ tool.description|default:'' }}</textarea>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Emplacement</label>
                                <input type="text" name="location" class="form-control" value="{{ tool.location|default:'' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Statut</label>
                                <select name="status" class="form-select">
                                    <option value="active" {% if tool.status == 'active' %}selected{% endif %}>Actif</option>
                                    <option value="under_calibration" {% if tool.status == 'under_calibration' %}selected{% endif %}>En calibration</option>
                                    <option value="lost" {% if tool.status == 'lost' %}selected{% endif %}>Perdu</option>
                                    <option value="down" {% if tool.status == 'down' %}selected{% endif %}>Hors service</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Prochain étalonnage *</label>
                                <input type="date" name="next_calibration_date" class="form-control" required value="{{ tool.next_calibration_date|date:'Y-m-d' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fréquence d'étalonnage (mois)</label>
                                <input type="number" name="calibration_frequency_months" class="form-control" value="{{ tool.calibration_frequency_months }}" min="1">
                            </div>
                        </div>
                        
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Enregistrer
                            </button>
                            <a href="/tools/" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
