<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion - Tool Calibration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .logout-container {
            max-width: 440px;
            width: 100%;
        }
        
        .logout-card {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logout-icon {
            width: 80px;
            height: 80px;
            background: #f3f4f6;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .logout-icon i {
            font-size: 3rem;
            color: #6b7280;
        }
        
        .logout-card h2 {
            font-weight: 800;
            font-size: 1.8rem;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        
        .logout-card p {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79, 70, 229, 0.35);
            color: white;
        }
        
        .btn-secondary-custom {
            background: #f3f4f6;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 600;
            color: #374151;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-secondary-custom:hover {
            background: #e5e7eb;
            color: #1a1a2e;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .divider span {
            padding: 0 15px;
            color: #9ca3af;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .footer-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }
        
        .footer-links a:hover {
            color: #4f46e5;
        }
        
        @media (max-width: 480px) {
            .logout-card { padding: 30px 20px; }
            .logout-card h2 { font-size: 1.5rem; }
            .logout-icon { width: 60px; height: 60px; }
            .logout-icon i { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="logout-container">
    <div class="logout-card">
        
        <div class="logout-icon">
            <i class="bi bi-box-arrow-right"></i>
        </div>
        
        <h2>À bientôt !</h2>
        <p>Vous avez été déconnecté avec succès.</p>
        
        <div class="d-flex flex-wrap gap-3 justify-content-center">
            <a href="/accounts/login/" class="btn-primary-custom">
                <i class="bi bi-box-arrow-in-right"></i> Se reconnecter
            </a>
            <a href="/" class="btn-secondary-custom">
                <i class="bi bi-house"></i> Accueil
            </a>
        </div>
        
        <div class="divider">
            <span>ou</span>
        </div>
        
        <div class="footer-links">
            <a href="/"><i class="bi bi-tools me-1"></i> Tool Calibration</a>
            <a href="#"><i class="bi bi-question-circle me-1"></i> Aide</a>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
