services:
  db:
    image: mariadb:10.11
    container_name: tool_calibration_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: toolcalibration
      MYSQL_USER: django_user
      MYSQL_PASSWORD: letmeinyusuf
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - tool_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  web:
    build: .
    container_name: tool_calibration_web
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application --workers=1 --threads=2 --timeout=300
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: toolcalibration
      DB_USER: django_user
      DB_PASSWORD: letmeinyusuf
      DB_HOST: db
      DB_PORT: 3306
      DEBUG: 'False'
      SECRET_KEY: ${SECRET_KEY}
      PYTHONUNBUFFERED: 1
    networks:
      - tool_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: tool_calibration_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - web
    networks:
      - tool_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  mariadb_data:
  static_volume:
  media_volume:

networks:
  tool_network:
    driver: bridge